<!DOCTYPE html>
<html lang="es">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De pesos Mexicanos a Dolares</title>
<link rel="stylesheet" href="css/ejercicio12.css">
</head>
<body>
 
  <div class="contenedor">
    <h1>Conversor de Dinero</h1>
    <p>Convertir de pesos Mexicanos a Dolares</p>

    <form class="formulario">
      <label for="pesos">Pesos</label>
      <input type="text" id="pesos" placeholder="Ejemplo:500">
      <button type="button" onclick="convertirPesos()">Convertir</button>
      <label for="dolares">Resultado a dolares</label>
      <input type="text" id="dolares" readonly placeholder="Resultado">
      <p id="mensaje"></p>
    </form>
  </div>
  
  <script src="js/ejercicio12.js"></script>
</body>

</html>
