<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones con Arreglos</title>
    <link rel="stylesheet" href="css/ejercicio14.css">
</head>
<body>

    <div class="contenedor">
        <h1>Operaciones con Números</h1>

        <p>Ingresa varios números separados por comas</p>

        <form>
            <label for="numeros">Números:</label>
            <input type="text" id="numeros" placeholder="Ejemplo: 10,20,30">

            <button type="button" onclick="calcularDatos()">Calcular</button>

            <label for="mayor">Número mayor:</label>
            <input type="text" id="mayor" readonly>

            <label for="menor">Número menor:</label>
            <input type="text" id="menor" readonly>

            <label for="promedio">Promedio:</label>
            <input type="text" id="promedio" readonly>

            <p id="mensaje"></p>
        </form>
    </div>

    <script src="js/ejercicio14.js"></script>
</body>
</html>
