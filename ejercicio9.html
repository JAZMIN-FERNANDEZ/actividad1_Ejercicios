
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Contacto DevSolutions</title>

    <link rel="stylesheet" href="css/ejercicio9.css">
</head>

<body>

    <div class="contenedor-formulario">

        <h1>Contáctanos</h1>

        <p class="subtitulo">
            ¿Tienes dudas? Escríbenos y te responderemos en 24h.
        </p>

        <form class="formulario">

            <div class="grupo-formulario">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej: Jazmin Fernandez"
                    required
                >

            </div>

            <div class="grupo-doble">

                <div class="grupo-formulario">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="jazmin@ejemplo.com"
                        required
                    >

                </div>

                <div class="grupo-formulario">

                    <label for="telefono">
                        Teléfono (opcional)
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        placeholder="+52 951 124 5678"
                    >

                </div>

            </div>

            <div class="grupo-formulario">

                <label for="mensaje">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    rows="5"
                    placeholder="Describe tu consulta..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="boton-enviar">
                Enviar mensaje →
            </button>

        </form>

    </div>

</body>

</html>
